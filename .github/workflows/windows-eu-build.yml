name: StormPK EU Windows C++ build
on:
  push:
    paths:
      - '.github/workflows/windows-eu-build.yml'
      - 'Server/**'
      - 'game/**'
      - 'shared/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-cpp:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Detect Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products '*' -property installationPath
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory | Select-Object -ExpandProperty Name
          Write-Host "Installed Windows SDKs: $($sdk -join ', ')"
      - name: Build server DLL 32-bit Release
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild 'Server/server/server.vcxproj' '/t:Build' '/p:Configuration=Release' '/p:Platform=Win32' '/p:PlatformToolset=v143' '/p:PostBuildEventUseInBuild=false' '/m:2' '/v:minimal' '/flp:logfile=server-build.log;verbosity=normal'
          if ($LASTEXITCODE -ne 0) { throw "Server C++ build failed" }
      - name: Build game DLL 32-bit Release
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild 'game/game/game.vcxproj' '/t:Build' '/p:Configuration=Release' '/p:Platform=Win32' '/p:PlatformToolset=v143' '/p:PostBuildEventUseInBuild=false' '/m:2' '/v:minimal' '/flp:logfile=game-build.log;verbosity=normal'
          if ($LASTEXITCODE -ne 0) { throw "Client C++ build failed" }
      - name: Upload Windows libraries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StormPK-EU-Windows-x86-DLLs
          path: |
            bin/**/*.dll
            Server/data/**/*.dll
            game/bin/**/*.dll
          if-no-files-found: error
          retention-days: 15
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StormPK-EU-build-diagnostics
          path: |
            server-build.log
            game-build.log
          if-no-files-found: ignore
